<title>财税 Agent Harness 功能演示</title>
<!--
  功能演示动画（2026-11-23）。单文件、无外部依赖，双击即可在浏览器打开。
  画面是对真实前端的复刻：样式取自 frontend/src/style.css（T50 浅色版），页面结构、按钮与提示文案取自 frontend/src/App.tsx，
  工具说明、核验提示取自后端代码，发票与流水取自官方合成种子数据（C001 2026-09：10 张、9,622.06 元、缺用途 5 张）。
  这里没有真实后端：每一步由脚本按演示讲稿驱动光标去点、去输入，模型回复是按真实回复格式写好的示例。
  页面里的 Agent、知识文件、Excel、扫描件、C002 长任务对应讲稿「录制前准备」里提前准备的合成数据。
-->
<style>
/* ═════ 1. 真实前端的样式（frontend/src/style.css，去掉 Tailwind 入口与按窗口宽度的响应式规则） ═════ */
@property --angle { syntax:'<angle>'; inherits:false; initial-value:0deg }
.app-root {
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  font-family:var(--font-sans); font-size:14px; line-height:1.65; font-synthesis:none; -webkit-font-smoothing:antialiased; color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --raised:#f4f4f5; --soft:#f9f9fa; --line:#ececee; --line-strong:#dcdce0;
  --text:#0d0d0d; --text-2:#3f3f46; --muted:#6e6e80; --faint:#a1a1aa; --border:var(--line);
  --accent:#0d0d0d; --accent-soft:#f1f1f3; --info:#2f5bea; --info-soft:#eef2ff; --ok:#0e8a6a; --ok-soft:#e8f6f1;
  --warn:#a85d00; --warn-soft:#fdf4e3; --danger:#c0362c; --danger-soft:#fdeeec;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .04); --shadow-md:0 1px 2px rgb(0 0 0 / .04), 0 8px 24px -8px rgb(0 0 0 / .08);
  --shadow-lg:0 2px 6px rgb(0 0 0 / .04), 0 24px 64px -16px rgb(0 0 0 / .16);
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.4,.64,1);
  color:var(--text); background:var(--bg);
}
.app-root * { box-sizing:border-box }
.app-root button,.app-root input,.app-root select,.app-root textarea { font:inherit }
.app-root button { cursor:pointer; color:inherit }
.app-root button:disabled { cursor:not-allowed; opacity:.4 }
.app-root h1,.app-root h2,.app-root h3,.app-root p { margin:0 }
.app-root h1 { font-size:30px; font-weight:500; letter-spacing:-.025em; line-height:1.2 }
.app-root h2 { font-size:16px; font-weight:600; letter-spacing:-.01em }
.app-root h3 { font-size:14px; font-weight:600; margin:24px 0 10px }
.app-root svg { flex-shrink:0 }
.app-root pre,.app-root code { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace }
.app-root pre { white-space:pre-wrap; overflow-wrap:anywhere; max-height:340px; overflow:auto; font-size:12px; color:var(--text-2); background:var(--soft); padding:16px; border:1px solid var(--line); border-radius:12px; margin-top:12px }
.app-root code { overflow-wrap:anywhere; font-size:12px }
.app-root label { display:grid; gap:8px; font-size:13px; color:var(--text-2) }
.app-root input,.app-root select,.app-root textarea { width:100%; min-width:0; border:1px solid var(--line-strong); border-radius:12px; color:var(--text); background:var(--surface); padding:10px 13px; outline:none; transition:border-color .2s, box-shadow .25s var(--ease-out) }
.app-root input:focus,.app-root select:focus,.app-root textarea:focus { border-color:var(--text); box-shadow:0 0 0 4px rgb(13 13 13 / .07) }
.app-root input:disabled,.app-root select:disabled,.app-root textarea:disabled { background:var(--soft); color:var(--muted) }
.app-root textarea { resize:vertical; min-height:90px }
.app-root input::placeholder,.app-root textarea::placeholder { color:var(--faint) }
.app-root select { appearance:auto }
.app-root input[type='checkbox'] { accent-color:var(--text); width:auto }
.app-root details { border-bottom:1px solid var(--line); padding:14px 0 }
.app-root summary { cursor:pointer; color:var(--text-2); font-size:13px; line-height:1.8 }
.app-root summary::marker { color:var(--faint) }
.app-root details[open]>summary { margin-bottom:12px }
.app-root details[open]>:not(summary) { animation:fade-up .35s var(--ease-out) backwards }
.app-root small { font-size:11px; color:var(--muted) }
.app-root dl { margin:12px 0; display:grid; gap:8px }
.app-root dt { font-size:12px; color:var(--muted) }
.app-root dd { margin:0; overflow-wrap:anywhere; white-space:pre-wrap }
.muted { color:var(--muted); font-size:13px }
.hint { color:var(--muted); font-size:12.5px }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }
.inline-icon { display:inline; vertical-align:-2px }

.app-shell { display:flex; flex-direction:column; overflow-x:clip; background:var(--bg) }
.topbar { position:sticky; top:0; z-index:30; height:64px; display:flex; align-items:center; gap:36px; padding:0 40px; background:rgb(255 255 255 / .9); border-bottom:1px solid transparent }
.brand { background:none; border:0; padding:0; display:flex; gap:10px; align-items:center; text-align:left; font-size:15px; font-weight:600; letter-spacing:-.01em }
.brand-mark { width:30px; height:30px; display:grid; place-items:center; background:var(--text); color:#fff; border-radius:9px }
.brand-mark svg { width:16px; height:16px }
.brand small { display:block; font-size:9px; font-weight:500; letter-spacing:.2em; line-height:1.3; color:var(--muted) }
.topbar nav { position:relative; display:flex; align-items:center; gap:2px }
.topbar nav::before { content:''; position:absolute; top:0; left:0; height:var(--ind-h,0); width:var(--ind-w,0); border-radius:999px; background:var(--raised); transform:translate(var(--ind-x,0), var(--ind-y,0)); opacity:var(--ind-o,0); pointer-events:none }
.topbar nav[data-ready]::before { transition:transform .55s var(--ease-out), width .55s var(--ease-out), opacity .3s }
.topbar nav button { position:relative; z-index:1; background:none; border:0; padding:6px 14px; border-radius:999px; color:var(--muted); font-size:13.5px; white-space:nowrap; transition:color .25s }

.environment-line>span:not(.dot) { color:var(--faint) }
.dot { position:relative; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ok) }
.dot::after { content:''; position:absolute; inset:0; border-radius:50%; background:var(--ok); animation:ping 2.4s var(--ease-out) infinite }
@keyframes ping { 0% { transform:scale(1); opacity:.5 } 80%,100% { transform:scale(3); opacity:0 } }
.main { width:100%; flex:1; outline:none }
.app-root footer { text-align:center; padding:20px 20px 22px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line) }
.app-root footer span { margin:0 10px; color:var(--line-strong) }

.button { border:1px solid transparent; display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:999px; min-height:36px; padding:8px 16px; font-size:13px; font-weight:500; line-height:1.4; transition:background .2s, border-color .2s, color .2s, transform .2s var(--ease-out), box-shadow .25s }
.button.pressed { transform:scale(.97) }
.button.secondary { background:var(--raised); color:var(--text) }
.button.primary { color:#fff; background:var(--text) }
.button.ghost { background:transparent; color:var(--muted) }
.button.hover.secondary { background:#e9e9ec }
.button.hover.primary { background:#2a2a2e; box-shadow:0 6px 18px -6px rgb(0 0 0 / .35) }
.button.hover.ghost { background:var(--raised); color:var(--text) }

@keyframes fade-in { from { opacity:0 } }
@keyframes fade-up { from { opacity:0; transform:translateY(8px) } }
@keyframes rise { from { opacity:0; transform:translateY(18px) } }
@keyframes rise-blur { from { opacity:0; transform:translateY(.45em); filter:blur(10px) } }
@keyframes pop { 0% { transform:scale(.6); opacity:0 } 60% { transform:scale(1.12) } 100% { transform:scale(1) } }
@keyframes spin { to { transform:rotate(360deg) } }
@keyframes spin-angle { to { --angle:360deg } }
@keyframes shimmer { from { background-position:100% 0 } to { background-position:-100% 0 } }
@keyframes blink { 50% { opacity:.2 } }
.content-page, .workspace-heading, .terminal-task { animation:rise .7s var(--ease-out) backwards }
.page-heading > div > * { animation:rise .8s var(--ease-out) backwards }
.page-heading > div > :nth-child(2) { animation-delay:60ms }
.page-heading > div > :nth-child(3) { animation-delay:120ms }
.error-banner, .operation-warning { animation:fade-up .45s var(--ease-out) backwards }

.home { max-width:880px; margin:0 auto; padding:72px 32px 64px }
.hero { position:relative; isolation:isolate; text-align:center }
.aurora { position:absolute; z-index:-1; left:50%; top:-150px; width:1180px; height:620px; transform:translateX(-50%); pointer-events:none; filter:blur(70px) saturate(150%); opacity:.6; animation:fade-in 2.4s ease-out backwards; -webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent); mask-image:radial-gradient(closest-side,#000 35%,transparent) }
.aurora span { position:absolute; width:42%; aspect-ratio:1; border-radius:50%; mix-blend-mode:multiply; animation:drift 24s ease-in-out infinite alternate }
.aurora span:nth-child(1) { background:#c7d2fe; left:10%; top:14% }
.aurora span:nth-child(2) { background:#fbcfe8; left:36%; top:2%; animation-duration:28s; animation-delay:-7s }
.aurora span:nth-child(3) { background:#fde68a; left:52%; top:20%; animation-duration:32s; animation-delay:-13s }
.aurora span:nth-child(4) { background:#a7f3d0; left:26%; top:32%; animation-duration:26s; animation-delay:-4s }
@keyframes drift { 0% { transform:translate(0,0) scale(1) } 50% { transform:translate(9%,-6%) scale(1.1) } 100% { transform:translate(-8%,7%) scale(.92) } }
.eyebrow { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:500; letter-spacing:.12em; color:var(--text-2); padding:4px 12px; border:1px solid var(--line); border-radius:999px; background:rgb(255 255 255 / .7) }
.eyebrow svg { width:13px; height:13px }
.hero > .eyebrow { animation:rise .8s var(--ease-out) backwards }
.hero h1 { font-size:58px; font-weight:500; letter-spacing:-.03em; line-height:1.14; margin:24px 0 16px }
.split .tok { display:inline-block; white-space:pre; animation:rise-blur 1s var(--ease-out) backwards }
.hero > p { color:var(--text-2); font-size:17px; animation:rise .9s var(--ease-out) .45s backwards }
.source-task-note { color:var(--info); font-size:12.5px; display:flex; align-items:center; justify-content:center; gap:8px; margin:20px auto -12px; line-height:1.6 }
.goal-composer { position:relative; margin:40px auto 18px; text-align:left; padding:18px 20px 12px; border-radius:26px; border:1px solid var(--line-strong); background:var(--surface); box-shadow:var(--shadow-md); transition:box-shadow .4s var(--ease-out); animation:rise .9s var(--ease-out) .55s backwards, spin-angle 6s linear infinite paused }
.goal-composer:focus-within { border-color:transparent; background:linear-gradient(var(--surface),var(--surface)) padding-box, conic-gradient(from var(--angle),#a5b4fc,#f0abfc,#fdba74,#6ee7b7,#a5b4fc) border-box; box-shadow:0 18px 50px -18px rgb(99 102 241 / .35); animation-play-state:running, running }
.goal-composer>textarea { border:0; padding:3px 0; min-height:84px; resize:none; background:transparent; font-size:16px; box-shadow:none !important }
.composer-bottom { display:flex; justify-content:space-between; align-items:center; gap:12px }
.composer-bottom>span { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center }
.composer-bottom .button { width:36px; height:36px; min-height:36px; padding:0; border-radius:50% }
.agent-picker { display:flex !important; align-items:center; gap:8px; margin:12px 0 0; font-size:12px; color:var(--muted) }
.agent-picker select { max-width:280px; padding:6px 12px; border-radius:999px; font-size:12.5px }
.pending { border-bottom:0 !important; padding:9px 0 0 !important }
.pending summary { font-size:12px; color:var(--muted) }
.pending input { margin-bottom:5px }
.suggestions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; text-align:left }
.suggestions button { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; color:var(--text-2); font-size:13px; line-height:1.6; text-align:left; animation:rise .8s var(--ease-out) backwards }
.suggestions button:nth-child(1) { animation-delay:.65s } .suggestions button:nth-child(2) { animation-delay:.72s } .suggestions button:nth-child(3) { animation-delay:.79s }
.suggestions button>span { color:var(--faint); font-size:11px; font-variant-numeric:tabular-nums }
.suggestions button svg { margin-left:auto; color:var(--faint) }
.recent { margin-top:72px }
.section-heading { display:flex; justify-content:space-between; align-items:center; gap:12px }
.recent h2 { font-size:15px; font-weight:600 }

.task-list { margin-top:14px; display:grid; gap:2px }
.task-row { width:100%; display:flex; align-items:center; gap:14px; padding:14px 14px; background:transparent; border:0; border-radius:14px; text-align:left; color:var(--text); min-width:0; transition:background .2s; animation:fade-up .55s var(--ease-out) backwards }
.task-row.hover { background:var(--raised) }
.task-row>svg:first-child { box-sizing:content-box; padding:8px; border-radius:50%; background:var(--raised); color:var(--muted) }
.task-row>svg:last-child { color:var(--faint) }
.task-row>span { flex:1; overflow-wrap:anywhere; min-width:0; font-size:14px }
.task-row small { display:block; margin-top:2px; font-size:11.5px; letter-spacing:.01em }
.empty { padding:32px 0; color:var(--muted); font-size:13.5px }

.content-page { max-width:980px; margin:56px auto 72px; padding:0 32px }
.page-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:36px }
.page-heading h1, .content-page>h1 { font-size:44px !important; letter-spacing:-.03em; margin:16px 0 10px }
.page-heading .muted { font-size:15px; max-width:680px; line-height:1.7 }
.content-page>p { margin-bottom:25px }
.error-banner, .operation-warning { max-width:1000px; margin:14px auto; padding:14px 18px; border-radius:14px; overflow-wrap:anywhere; font-size:13px; line-height:1.7 }
.error-banner { color:var(--danger); background:var(--danger-soft); border:1px solid #f6d3cf; display:flex; gap:20px; align-items:center; justify-content:space-between }

.open-task-banner { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px; width:100%; max-width:920px; padding:16px 20px; margin:28px auto 0; border:1px solid var(--line); border-radius:18px; background:rgb(255 255 255 / .8); box-shadow:var(--shadow-md); color:var(--text-2); text-align:left; animation:rise .8s var(--ease-out) .5s backwards }
.open-task-banner>div:first-child { flex:1; min-width:200px }

.cancel-task-detail { display:grid; gap:16px; margin-top:18px; max-width:520px }

.workspace-main { max-width:1080px; margin:auto; display:flex; flex-direction:column; height:650px; min-height:520px; padding:0 40px }
.workspace-heading { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:18px 0 18px; border-bottom:1px solid var(--line) }
.workspace-heading h1 { font-size:20px !important; letter-spacing:-.02em; margin:4px 0 6px; overflow-wrap:anywhere; font-weight:600 !important }
.workspace-heading>div:first-child { min-width:0 }
.workspace-heading .muted { font-size:12px }
.back { font-size:12px; border:0; background:none; padding:0; color:var(--muted) }
.workspace-actions { display:flex; gap:8px; flex-shrink:0 }
.terminal-task { flex:1; min-height:240px; width:min(100%,620px); margin:0 auto; padding:40px 20px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:14px; overflow:auto }
.terminal-icon { width:48px; height:48px; border-radius:16px; color:#fff; background:var(--text); display:grid; place-items:center; margin-bottom:6px; animation:pop .7s var(--ease-spring) .15s backwards }

.terminal-meta { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:12px }
.terminal-task .button { margin-top:12px }
.thread { flex:1; overflow:auto; min-height:120px; padding:28px 10px 20px; scrollbar-width:none; -webkit-mask-image:linear-gradient(transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image:linear-gradient(transparent, #000 24px, #000 calc(100% - 24px), transparent) }
.thread::-webkit-scrollbar { display:none }
.thread-inner { max-width:760px; margin:auto; display:flex; flex-direction:column }
.message { margin-bottom:30px; animation:fade-up .5s var(--ease-out) backwards }
.message-label { display:flex; align-items:center; gap:8px; color:var(--text); font-size:13px; margin-bottom:10px; font-weight:600 }
.message-label>span { font-size:11px; color:var(--faint); font-weight:400; margin-left:2px }
.message.agent .message-label svg { box-sizing:content-box; padding:5px; border-radius:50%; background:var(--text); color:#fff; width:13px; height:13px }
.message p { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--text); line-height:1.9; font-size:15px }

@keyframes msg-in { from { opacity:0; transform:translateY(10px) scale(.97); transform-origin:right bottom } }

.request-state { display:flex; align-items:center; gap:9px; font-size:13px; padding:12px 0; color:transparent; background:linear-gradient(90deg, var(--muted) 0 40%, var(--text) 50%, var(--muted) 60% 100%); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; animation:shimmer 2.2s linear infinite }
.request-state svg { color:var(--muted); animation:spin 1.4s linear infinite }
.composer { flex-shrink:0; background:var(--surface); border:1px solid var(--line-strong); border-radius:24px; padding:14px 16px 10px; margin:0 auto; width:100%; max-width:780px; box-shadow:var(--shadow-md); transition:border-color .25s, box-shadow .35s var(--ease-out) }

.tool-group ol { list-style:none; padding-left:16px; border-left:1px solid var(--line-strong); margin:12px 0 0 6px }

  await scrollThread(300)
  for (const [tool, ms] of steps) {
    p.querySelector('span').textContent = `正在${toolNames[tool]}…`; await sleep(ms)
    p.querySelector('span').textContent = `${toolNames[tool]}已完成`; await sleep(380)
  }
  return p
}
async function stream(text, tools = [], cps = 70) {
  const a = addMessage(`<article class="message agent streaming"><div class="message-label">${ic('sparkles', 15)}财税 Agent <span>模型生成 · 不代表保存成功</span></div><p></p></article>`)
  const p = a.querySelector('p'), chars = [...text]
  for (let i = 0; i < chars.length; i += 3) { p.textContent = chars.slice(0, i + 3).join(''); if (i % 30 === 0) $('.thread').scrollTop = 1e6; await sleep(3000 / cps) }
  a.outerHTML = msgAgent(text, tools)
  await scrollThread(300)
}

    }},

      await click('.identity-button')
      modal({title: '选择工作空间', desc: '本地模拟身份，不是生产认证。权限由后端逐次校验。', body: ident('C001')})
      await choose('#role', 'viewer'); say('切换用户：甲企业的只读成员 U002。')
      await click('[data-act="enter"]'); closeModal(); setIdentity('C001', 'viewer'); homePage({tasks: []}); await sleep(900)
      await click('[data-act="memory"]')
      modal({title: '长期记忆', desc: '只记录你明确提供的内容，不会从模型文本自动提取。同名时以最新一次为准；同名不同范围时，范围越具体越优先（仅我 · 当前企业 > 个人 > 企业共享）。删除或过期后，存储与历史模型输入中的内容一并清除，不可恢复。', body: `<div class="stack"><div class="memory-row"><p><span class="rule-chip">企业共享</span> <strong>回复格式</strong>：先给合计再列明细</p><small class="muted">原话：以后回复先给合计再列明细</small></div><form class="stack" onsubmit="return false"><label>范围<select id="scope"><option>仅我 · 当前企业（C001）</option><option>个人 · 所有企业（不能含企业、发票或流水编号）</option></select></label><label>名称<input placeholder="例如 style"></label><label>明确值<input placeholder="例如 简洁"></label><label>你的原话<textarea placeholder="例如：以后回答尽量简洁"></textarea></label><button class="button primary" type="button">保存 / 更正</button></form></div>`})
      await sleep(500); await moveTo('.dialog .memory-row')
      say('只读成员看得到企业共享那条，<b>看不到操作员的个人记忆</b>；没有删除按钮。'); await sleep(3000)
      await moveTo('#scope'); say('范围下拉只有两项：不能新建企业共享记忆。'); await sleep(2400)
      await click('.dialog .close'); closeModal()
      await click('.identity-button')
      modal({title: '选择工作空间', desc: '本地模拟身份，不是生产认证。权限由后端逐次校验。', body: ident('C001')})
      $('#role').value = 'viewer'
      await choose('#ent', 'C002'); say('再让只读成员访问乙企业 C002……')
      await click('[data-act="enter"]')

      say('……服务端直接拒绝：<b>PERMISSION_DENIED</b>，身份保持不变。权限每次后端重新校验。'); await sleep(3400)
      await click('.dialog .close'); closeModal()

      await moveTo('.recent .task-list'); say('一条主线：查询 → 缺口 → 补充/改口 → 审核 → 批准 → 回读 → 复查，每一步都能核对。'); await sleep(4200)

/* ═════ player ═════ */
const playBtn = document.getElementById('play'), statusEl = document.getElementById('status'), barEl = document.getElementById('bar'), chaptersEl = document.getElementById('chapters')
let current = 0
CHAPTERS.forEach((c, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `第 ${i + 1} 章：${c.title}`); b.addEventListener('click', () => start(i, true)); barEl.appendChild(b)
  const d = document.createElement('button'); d.type = 'button'; d.className = 'chap'
  d.innerHTML = `<span class="k">${String(i + 1).padStart(2, '0')} · ${c.tag.join(' · ')}</span><span class="t">${c.title}</span><span class="s">${c.sub}</span>`
  d.addEventListener('click', () => { start(i, true); viewport.scrollIntoView({block: 'nearest', behavior: 'smooth'}) }); chaptersEl.appendChild(d)
})
function mark(i) {
  current = i
  statusEl.textContent = `第 ${i + 1} / ${CHAPTERS.length} 章`
  ;[...barEl.children].forEach((b, j) => { b.classList.toggle('done', j < i); b.classList.toggle('on', j === i) })
  ;[...chaptersEl.children].forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'))
}
function setPlaying(v) { playing = v; stage.classList.toggle('paused', !v); playBtn.textContent = v ? '暂停' : '播放' }
async function titleCard(c, i) {
  cardEl.innerHTML = `<div class="inner">${i === 0 ? `<div class="mark">${ic('sparkles', 34)}</div>` : `<span class="num">${String(i + 1).padStart(2, '0')} / ${CHAPTERS.length}</span>`}<div class="tags">${c.tag.map(t => `<span>${t}</span>`).join('')}</div><h2>${c.title}</h2><p>${c.sub}</p></div>`
  cardEl.classList.remove('hide')
  await sleep(i === 0 ? 3000 : 2200)
  cardEl.classList.add('hide')
  await sleep(450)
}
async function start(i, fromUser = false) {
  token++
  closeModal(); say('')
  i = Math.max(0, Math.min(CHAPTERS.length - 1, i))
  mark(i)
  const my = token
  if (fromUser && !playing) setPlaying(true)
  try {
    for (let k = i; k < CHAPTERS.length; k++) {
      mark(k)
      const c = CHAPTERS[k]
      c.setup(); settle()
      tagEl.hidden = false; tagEl.innerHTML = `<i>${String(k + 1).padStart(2, '0')}</i>${c.tag.join(' · ')}`
      await titleCard(c, k)
      await c.run()
      say(''); await sleep(600)
    }
    setPlaying(false)
  } catch (e) {
    if (!(e instanceof Cancelled)) { console.error(e); if (my === token) setPlaying(false) }
  }
}
playBtn.addEventListener('click', () => setPlaying(!playing))
document.getElementById('prev').addEventListener('click', () => start(current - 1, true))
document.getElementById('next').addEventListener('click', () => start(current + 1, true))
document.getElementById('speed').addEventListener('change', e => { speed = parseFloat(e.target.value) || 1 })
document.addEventListener('keydown', e => {
  if (e.target.closest('button, select, input, textarea')) return
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing) }
  if (e.key === 'ArrowRight') start(current + 1, true)
  if (e.key === 'ArrowLeft') start(current - 1, true)
})
// The viewer's own clicks inside the stage must not change the scripted UI.
stage.addEventListener('click', e => { e.preventDefault(); e.stopPropagation() }, true)
stage.addEventListener('mousedown', e => e.preventDefault(), true)
stage.addEventListener('keydown', e => e.preventDefault(), true)

const params = new URLSearchParams(location.search)
if (params.has('capture')) { document.body.classList.add('capture'); fit() }
const ch = Math.max(1, Math.min(CHAPTERS.length, parseInt(params.get('chapter') || '1', 10) || 1)) - 1
window.__start = (i, play = true) => { setPlaying(play); start(i) }
window.__setPlaying = setPlaying
setPlaying(params.has('autoplay'))
start(ch)
if (params.has('at')) { setPlaying(false); stage.classList.remove('paused'); window.__advance(parseInt(params.get('at'), 10) || 0).then(() => { document.body.dataset.ready = '1' }) }
})()
</script>
